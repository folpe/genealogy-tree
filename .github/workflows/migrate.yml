name: Migrations

# Applique les migrations Drizzle sur la base de production (branche Neon `main`)
# dès qu'elles arrivent sur `main`. Elles ont déjà tourné en CI sur un Postgres de
# service et sur `dev` et `preview`. Le déploiement Vercel part en parallèle : une
# migration doit donc rester additive (expand puis contract), pour que l'ancienne
# et la nouvelle version de l'app tournent toutes deux sur le schéma migré.

on:
  push:
    branches: [main]
    paths:
      - src/server/db/migrations/**
  workflow_dispatch:

permissions:
  contents: read

# Jamais deux migrations en même temps, et jamais une migration interrompue.
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Le secret (rôle propriétaire, connexion directe) n'existe que dans cet
    # environnement, restreint à la branche `main`.
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx drizzle-kit migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
