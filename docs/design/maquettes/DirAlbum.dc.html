<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Thème clair Album premium</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&amp;family=Figtree:wght@400..700&amp;display=swap">
<style>
*{font-variation-settings:"SOFT" 100,"WONK" 0}
body{margin:0;background:#F6F2EA}
a{color:#A4532F}a:hover{color:#7C3D21}
button{font-family:inherit}
</style>
</helmet>
<div style="min-height: 100vh; height: 100vh; display: flex; flex-direction: column; background: #F6F2EA; color: #1F1C19; font-family: 'Figtree', system-ui, sans-serif; overflow: hidden">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 18px 32px">
    <div style="display: flex; align-items: center; gap: 12px; flex: 1 1 200px">
      <span style="width: 40px; height: 40px; border-radius: 50%; background: #1F1C19; display: inline-flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 32 32" fill="none" stroke="#F6F2EA" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M16 28V16"></path><path d="M16 20C16 16 11 15 9 12"></path><path d="M16 18C16 14 21 13 23 10"></path><circle cx="9" cy="9" r="3"></circle><circle cx="23" cy="7.5" r="3"></circle><circle cx="16" cy="12" r="3"></circle></svg>
      </span>
      <span style="font-family: 'Fraunces', serif; font-size: 24px; font-weight: 500; letter-spacing: -0.01em">Racines</span>
    </div>
    <nav aria-label="Vues" style="display: flex; gap: 2px; padding: 4px; border-radius: 999px; border: 1px solid #E4DCCF; background: #FBF9F5">
      <button type="button" aria-pressed="true" style="height: 38px; padding: 0 18px; border: 0; border-radius: 999px; background: #1F1C19; color: #F6F2EA; font-size: 14px; font-weight: 600">Arbre</button>
      <button type="button" style="height: 38px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent; color: #6F675D; font-size: 14px; font-weight: 500">Ancêtres</button>
      <button type="button" style="height: 38px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent; color: #6F675D; font-size: 14px; font-weight: 500">Frise</button>
      <button type="button" style="height: 38px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent; color: #6F675D; font-size: 14px; font-weight: 500">Carte</button>
      <button type="button" style="height: 38px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent; color: #6F675D; font-size: 14px; font-weight: 500">Récits</button>
    </nav>
    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 12px; flex: 1 1 300px">
      <button type="button" style="display: flex; align-items: center; gap: 10px; height: 46px; min-width: 240px; padding: 0 16px; border: 1px solid #E4DCCF; border-radius: 999px; background: #FBF9F5; color: #6F675D; font-size: 15px">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <span style="flex: 1; text-align: left">Trouver quelqu'un</span>
        <span style="font-size: 12px; color: #9A9186">⌘K</span>
      </button>
      <span style="width: 46px; height: 46px; box-sizing: border-box; border-radius: 50%; border: 2px solid #FFFFFF; background: #EAE3D7; display: inline-flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-weight: 500; font-size: 17px; box-shadow: 0 0 0 1px #E4DCCF">H</span>
    </div>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap; gap: 20px; padding: 0 32px 32px; min-height: 0">
    <main style="position: relative; flex: 999 1 560px; min-width: 0; min-height: 600px; border-radius: 28px; border: 1px solid #E4DCCF; background-color: #F1EBE0; background-image: radial-gradient(rgba(31, 28, 25, 0.24) 1px, transparent 1.5px); background-size: 46px 46px; overflow: hidden">
      <div style="position: absolute; left: 50%; top: 50%; width: 720px; height: 580px; transform: translate(-50%, -50%)">
        <svg width="720" height="580" viewBox="0 0 720 580" fill="none" stroke-linecap="round" style="position: absolute; left: 0; top: 0" aria-hidden="true">
          <path d="M330 90 L470 90" stroke="#C9BCA9" stroke-width="2"></path>
          <path d="M400 90 C400 200 120 170 120 280 M400 90 C400 200 360 170 360 280" stroke="#C9BCA9" stroke-width="2"></path>
          <path d="M360 280 L520 280" stroke="#C9BCA9" stroke-width="2"></path>
          <path d="M360 320 C360 400 240 380 240 470" stroke="#A4532F" stroke-width="2.5"></path>
          <path d="M440 280 C440 390 420 360 420 470 M440 280 C440 390 560 360 560 470" stroke="#C9BCA9" stroke-width="2"></path>
        </svg>
        <sc-for list="{{ nodes }}" as="n" hint-placeholder-count="8">
          <div style="{{ n.wrap }}">
            <span style="{{ n.bubble }}">{{ n.initials }}</span>
            <span style="{{ n.name }}">{{ n.first }}</span>
            <span style="font-size: 12px; color: #8A8278; font-variant-numeric: tabular-nums">{{ n.years }}</span>
          </div>
        </sc-for>
      </div>
      <div style="position: absolute; right: 20px; bottom: 20px; display: flex; gap: 8px">
        <button type="button" aria-label="Zoomer" style="width: 46px; height: 46px; border: 1px solid #E4DCCF; border-radius: 50%; background: #FBF9F5; color: #1F1C19; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
        <button type="button" aria-label="Dézoomer" style="width: 46px; height: 46px; border: 1px solid #E4DCCF; border-radius: 50%; background: #FBF9F5; color: #1F1C19; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
        <button type="button" style="height: 46px; padding: 0 18px; border: 0; border-radius: 999px; background: #1F1C19; color: #F6F2EA; font-size: 14px; font-weight: 600">Me retrouver</button>
      </div>
    </main>

    <aside aria-label="Fiche" style="flex: 1 1 360px; max-width: 420px; box-sizing: border-box; border-radius: 28px; border: 1px solid #E4DCCF; background: #FFFFFF; box-shadow: 0 20px 50px rgba(31, 28, 25, 0.07); overflow: hidden; display: flex; flex-direction: column">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 36px 28px 24px; text-align: center">
        <span style="width: 128px; height: 128px; box-sizing: border-box; border-radius: 50%; border: 5px solid #FFFFFF; background: #EAE3D7; display: inline-flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-size: 44px; font-weight: 400; box-shadow: 0 0 0 1px #E4DCCF, 0 14px 30px rgba(31, 28, 25, 0.12)">MM</span>
        <span style="margin-top: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #A4532F">Ton demi-frère</span>
        <h2 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 400; font-size: 34px; letter-spacing: -0.01em">Maxime Marchand</h2>
        <span style="font-size: 14px; color: #6F675D">Né en 1987 à Nantes, vit à Lille</span>
      </div>
      <dl style="flex: 1; overflow-y: auto; margin: 0; padding: 0 28px; display: flex; flex-direction: column">
        <div style="display: flex; justify-content: space-between; gap: 16px; padding: 16px 0; border-top: 1px solid #EFE9DF">
          <dt style="font-size: 14px; color: #6F675D">Son père</dt>
          <dd style="margin: 0; font-size: 15px; text-align: right">Luc Marchand<br><span style="font-size: 13px; color: #8A8278">d'une précédente union</span></dd>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 0; border-top: 1px solid #EFE9DF">
          <dt style="font-size: 14px; color: #6F675D">Frère et sœur</dt>
          <dd style="margin: 0; display: flex; gap: 6px">
            <span style="display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px 0 4px; border-radius: 999px; background: #F6F2EA; font-size: 14px"><span style="width: 30px; height: 30px; border-radius: 50%; background: #EAE3D7; display: inline-flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-size: 12px">L</span>Léa</span>
            <span style="display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px 0 4px; border-radius: 999px; background: #F6F2EA; font-size: 14px"><span style="width: 30px; height: 30px; border-radius: 50%; background: #EAE3D7; display: inline-flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-size: 12px">H</span>Toi</span>
          </dd>
        </div>
        <div style="display: flex; justify-content: space-between; gap: 16px; padding: 16px 0; border-top: 1px solid #EFE9DF">
          <dt style="font-size: 14px; color: #6F675D">A aussi été élevé par</dt>
          <dd style="margin: 0; font-size: 15px; text-align: right">Sophie Marchand</dd>
        </div>
      </dl>
      <div style="display: flex; flex-direction: column; gap: 12px; padding: 18px 28px 28px">
        <span style="font-size: 13px; color: #6F675D; text-align: center">Ton cercle proche : tu peux modifier sa fiche</span>
        <div style="display: flex; gap: 10px">
          <button type="button" style="flex: 1; height: 50px; border: 1px solid #E4DCCF; border-radius: 999px; background: #FFFFFF; color: #1F1C19; font-size: 15px; font-weight: 600">Notre lien</button>
          <button type="button" style="flex: 1; height: 50px; border: 0; border-radius: 999px; background: #1F1C19; color: #F6F2EA; font-size: 15px; font-weight: 600">Modifier</button>
        </div>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
const PEOPLE = [
  { first: 'Paul', ini: 'PM', x: 330, y: 90, years: '1931-2008', dead: true },
  { first: 'Jeanne', ini: 'JM', x: 470, y: 90, years: '1934-2019', dead: true },
  { first: 'Anne', ini: 'AM', x: 120, y: 280, years: '1960' },
  { first: 'Luc', ini: 'LM', x: 360, y: 280, years: '1963' },
  { first: 'Sophie', ini: 'SM', x: 520, y: 280, years: '1965' },
  { first: 'Maxime', ini: 'MM', x: 240, y: 470, years: '1987', sel: true },
  { first: 'Léa', ini: 'LM', x: 420, y: 470, years: '1992' },
  { first: 'Toi', ini: 'HM', x: 560, y: 470, years: '1995', me: true }
];

class Component extends DCLogic {
  renderVals() {
    return {
      nodes: PEOPLE.map((p) => ({
        first: p.first,
        initials: p.ini,
        years: p.years,
        wrap: 'position: absolute; left: ' + (p.x - 70) + 'px; top: ' + (p.y - 38) + 'px; width: 140px; display: flex; flex-direction: column; align-items: center; gap: 4px',
        bubble: 'width: 76px; height: 76px; box-sizing: border-box; border-radius: 50%; border: 4px solid #FFFFFF; margin-bottom: 6px; background: ' + (p.dead ? '#E3DED6' : '#EAE3D7') + '; display: inline-flex; align-items: center; justify-content: center; font-family: Fraunces, serif; font-weight: 400; font-size: 24px; color: ' + (p.dead ? '#8A8278' : '#1F1C19') + '; box-shadow: ' + (p.sel ? '0 0 0 2px #A4532F, 0 12px 28px rgba(164, 83, 47, 0.22)' : '0 0 0 1px #E4DCCF, 0 8px 20px rgba(31, 28, 25, 0.1)'),
        name: 'font-family: Fraunces, serif; font-size: 16px; white-space: nowrap; color: ' + (p.me ? '#A4532F' : p.dead ? '#6F675D' : '#1F1C19')
      }))
    };
  }
}
</script>
</body>
</html>
