[build]
  # Phase 3 : le repo est passé à Next, servi par Vercel. Netlify ne rebâtit plus rien
  # et garde en ligne le dernier déploiement de l'ancienne app jusqu'à la bascule (lot 9).
  ignore = "exit 0"
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  BUN_VERSION = "1.3.13"

[dev]
  command = "bun run dev"
  port = 8888
  targetPort = 9000
  framework = "#custom"
  autoLaunch = true

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
