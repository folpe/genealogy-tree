[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  BUN_VERSION = "1.3.13"

[dev]
  command = "bun run dev"
  port = 8888
  targetPort = 9000
  framework = "#custom"
  autoLaunch = true

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
